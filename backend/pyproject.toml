[project]
name = "disease-prediction-api"
version = "1.0.0"
description = "Disease Prediction API using FastAPI and Machine Learning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.4.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "python-multipart>=0.0.6",
    "kagglehub>=0.3.13",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",  # Pin bcrypt to version compatible with passlib
    "python-jose[cryptography]>=3.3.0",
    "google-adk>=1.18.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "google-generativeai>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

