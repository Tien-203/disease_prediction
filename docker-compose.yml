version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: disease_prediction_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disease_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disease_password}
      POSTGRES_DB: ${POSTGRES_DB:-disease_prediction}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-disease_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - disease_prediction_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disease_prediction_backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-disease_user}:${POSTGRES_PASSWORD:-disease_password}@postgres:5432/${POSTGRES_DB:-disease_prediction}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./backend/ml/models:/app/ml/models:ro
      - ./backend/logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - disease_prediction_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=${FRONTEND_API_URL:-http://backend:8000/api/v1}
    container_name: disease_prediction_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - disease_prediction_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  disease_prediction_network:
    driver: bridge

