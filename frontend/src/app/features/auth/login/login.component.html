<div class="min-vh-100 d-flex align-items-center justify-content-center p-4 bg-gradient-light">
  <div class="login-card card shadow-lg border-primary" style="max-width: 420px; width: 100%;">
    <div class="card-body p-5">
      <h1 class="text-center fw-bold mb-2 fs-4 text-white">
        Welcome to Symptom-Based Prediction Application
      </h1>
      <p class="text-center mb-4 text-white-subtle">Please log in to your account</p>

      <nz-alert
        *ngIf="error"
        nzType="error"
        [nzMessage]="error"
        nzShowIcon
        class="mb-3"
      ></nz-alert>

      <form (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label text-white-subtle fw-medium small">Email</label>
          <input
            type="email"
            id="email"
            class="form-control form-control-lg"
            [(ngModel)]="email"
            name="email"
            placeholder="example@gmail.com"
            required
            [disabled]="loading"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label text-white-subtle fw-medium small">Password</label>
          <input
            type="password"
            id="password"
            class="form-control form-control-lg"
            [(ngModel)]="password"
            name="password"
            placeholder="Password"
            required
            [disabled]="loading"
          />
        </div>

        <div class="mb-4">
          <label for="role" class="form-label text-white-subtle fw-medium small">Login as</label>
          <select
            id="role"
            class="form-select form-select-lg"
            [(ngModel)]="selectedRole"
            name="role"
            required
            [disabled]="loading"
          >
            <option *ngFor="let option of roles" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </div>

        <button
          class="btn btn-success btn-lg w-100 fw-bold"
          type="submit"
          [disabled]="loading"
        >
          <span *ngIf="!loading">Log in</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Logging in...
          </span>
        </button>
      </form>

      <p class="text-center mt-4 mb-0 text-white-subtle small">
        Don't have an account?
        <a routerLink="/register" class="text-success fw-semibold text-decoration-none">Sign up</a>
      </p>
    </div>
  </div>
</div>
