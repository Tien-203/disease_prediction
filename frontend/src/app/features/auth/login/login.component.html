<div class="login-page">
  <div class="login-page__card">
    <h1 class="login-page__title">
      Welcome to Symptom-Based Prediction Application
    </h1>
    <p class="login-page__subtitle">Please log in to your account</p>

    <div *ngIf="error" class="login-page__error" role="alert">
      {{ error }}
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label class="form-label" for="email">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          [(ngModel)]="email"
          name="email"
          placeholder="example@gmail.com"
          required
          [disabled]="loading"
        />
      </div>

      <div class="form-field">
        <label class="form-label" for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
          required
          [disabled]="loading"
        />
      </div>

      <div class="form-field">
        <label class="form-label" for="role">Login as</label>
        <div class="select-wrapper">
          <select
            id="role"
            class="form-control form-control--select"
            [(ngModel)]="selectedRole"
            name="role"
            required
            [disabled]="loading"
          >
            <option *ngFor="let option of roles" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
          <span class="select-icon" aria-hidden="true">▾</span>
        </div>
      </div>

      <button
        class="login-button"
        type="submit"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Log in</span>
        <span *ngIf="loading">Logging in...</span>
      </button>
    </form>

    <p class="login-page__footer">
      Don't have an account?
      <a routerLink="/register">Sign up</a>
    </p>
  </div>
</div>
