<div class="dashboard-container">
  <h1>Data Scientist Dashboard</h1>
  
  <div class="stats-grid">
    @for (stat of modelStats; track stat.label) {
      <mat-card class="stat-card">
        <mat-card-content>
          <div class="stat-content">
            <div class="stat-info">
              <div class="stat-label">{{ stat.label }}</div>
              <div class="stat-value">{{ stat.value }}</div>
            </div>
            <mat-icon [color]="stat.color" class="stat-icon">{{ stat.icon }}</mat-icon>
          </div>
        </mat-card-content>
      </mat-card>
    }
  </div>

  <mat-card class="actions-card">
    <mat-card-header>
      <mat-card-title>Model Management</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="actions-grid">
        <button mat-raised-button color="primary" routerLink="/data-scientist/model-info">
          <mat-icon>science</mat-icon>
          Model Information
        </button>
        <button mat-raised-button color="accent" routerLink="/data-scientist/evaluation">
          <mat-icon>assessment</mat-icon>
          Evaluation Metrics
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
