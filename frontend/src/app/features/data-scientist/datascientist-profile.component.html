<div class="ds-profile">
  <section class="ds-profile__card">
    <h1 class="ds-profile__title">Personal Information</h1>

    <form (ngSubmit)="saveProfile()" class="ds-profile__form" novalidate>
      <label class="ds-profile__label" for="name">Data Scientist Name</label>
      <input
        id="name"
        name="name"
        type="text"
        required
        [(ngModel)]="name"
        class="ds-profile__input"
        placeholder="Enter your name"
      />

      <label class="ds-profile__label" for="idNumber">ID Number</label>
      <input
        id="idNumber"
        name="idNumber"
        type="text"
        required
        [(ngModel)]="idNumber"
        class="ds-profile__input"
        placeholder="Enter your ID"
      />

      <button type="submit" class="ds-profile__button">
        Save
      </button>

      <p class="ds-profile__success" *ngIf="showSuccess">Profile updated successfully.</p>
    </form>
  </section>
</div>
