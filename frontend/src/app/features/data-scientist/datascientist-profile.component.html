<div class="ds-profile">
  <section class="ds-profile__card">
    <h1 class="ds-profile__title">Personal Information</h1>

    <div *ngIf="error" class="ds-profile__error" role="alert">
      {{ error }}
    </div>

    <div *ngIf="success" class="ds-profile__success" role="alert">
      {{ success }}
    </div>

    <form (ngSubmit)="saveProfile()" class="ds-profile__form" *ngIf="!loading" novalidate>
      <label class="ds-profile__label" for="name">Data Scientist Name</label>
      <input
        id="name"
        name="name"
        type="text"
        required
        [(ngModel)]="name"
        class="ds-profile__input"
        placeholder="Enter your name"
        [disabled]="saving"
      />

      <label class="ds-profile__label" for="idNumber">ID Number</label>
      <input
        id="idNumber"
        name="idNumber"
        type="text"
        required
        [(ngModel)]="idNumber"
        class="ds-profile__input"
        placeholder="Enter your ID"
        [disabled]="saving"
      />

      <button type="submit" class="ds-profile__button" [disabled]="saving">
        <span *ngIf="!saving">Save</span>
        <span *ngIf="saving">Saving...</span>
      </button>
    </form>

    <div *ngIf="loading" class="ds-profile__loading">
      <p>Loading profile...</p>
    </div>
  </section>
</div>
