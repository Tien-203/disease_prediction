<div class="doctor-dataset">
  <section class="doctor-dataset__card">
    <h1 class="doctor-dataset__title">Dataset</h1>

    <div class="doctor-dataset__filters">
      <div class="doctor-dataset__search">
        <span class="doctor-dataset__search-icon">🔍</span>
        <input
          type="text"
          placeholder="Search for disease"
          [(ngModel)]="searchTerm"
        />
      </div>

      <button type="button" class="doctor-dataset__export" (click)="exportDataset()">
        Export Dataset
      </button>
    </div>

    <div class="doctor-dataset__list" *ngIf="!isLoading">
      <article class="doctor-dataset__item" *ngFor="let record of filteredRecords">
        <div class="doctor-dataset__column">
          <span class="doctor-dataset__label">Date Modified</span>
          <span class="doctor-dataset__value">{{ record.date_modified }}</span>
        </div>
        <div class="doctor-dataset__column">
          <span class="doctor-dataset__label">Disease</span>
          <span class="doctor-dataset__value">{{ record.disease }}</span>
        </div>
        <div class="doctor-dataset__column">
          <span class="doctor-dataset__label">Symptoms</span>
          <ul class="doctor-dataset__symptoms">
            <li *ngFor="let symptom of record.symptoms">{{ symptom }}</li>
          </ul>
        </div>
      </article>
      
      <div class="doctor-dataset__empty" *ngIf="filteredRecords.length === 0">
        <p>No records found{{ searchTerm ? ' matching your search' : '' }}.</p>
      </div>
    </div>

    <div class="doctor-dataset__loading" *ngIf="isLoading">
      <p>Loading dataset...</p>
    </div>
  </section>
</div>
