<div class="doctor-patients">
  <section class="doctor-patients__card">
    <h1 class="doctor-patients__title">Patient Recorded</h1>

    <div class="doctor-patients__filters">
      <div class="doctor-patients__search">
        <span class="doctor-patients__search-icon">🔍</span>
        <input
          type="text"
          placeholder="Search for patient"
          [(ngModel)]="searchTerm"
        />
      </div>

      <div class="doctor-patients__date-group">
        <button type="button" class="doc-chip" (click)="openDateModal('from')">
          <span>From</span>
          <strong>{{ fromDate }}</strong>
        </button>
        <button type="button" class="doc-chip" (click)="openDateModal('to')">
          <span>To</span>
          <strong>{{ toDate }}</strong>
        </button>
      </div>

      <button type="button" class="doctor-patients__export" (click)="exportPatients()">
        Export
      </button>
    </div>

    <div class="doctor-patients__list">
      <article class="doctor-patients__item" *ngFor="let record of filteredRecords">
        <div class="doctor-patients__column">
          <span class="doctor-patients__label">Date Recorded</span>
          <span class="doctor-patients__value">{{ record.dateRecorded }}</span>
        </div>
        <div class="doctor-patients__column">
          <span class="doctor-patients__label">Patient name</span>
          <span class="doctor-patients__value">{{ record.patientName }}</span>
        </div>
        <div class="doctor-patients__column">
          <span class="doctor-patients__label">Disease predicted</span>
          <ul class="doctor-patients__diseases">
            <li *ngFor="let disease of record.diseases">{{ disease }}</li>
          </ul>
        </div>
      </article>
    </div>
  </section>
</div>

<div class="doctor-modal-overlay" *ngIf="dateModalOpen">
  <div class="doctor-modal">
    <button type="button" class="doctor-modal__close" aria-label="Close date picker" (click)="closeDateModal()">
      &times;
    </button>

    <div class="doctor-modal__chips">
      <button
        type="button"
        class="doc-chip"
        [class.doc-chip--active]="activeDatePicker === 'from'"
        (click)="openDateModal('from')"
      >
        <span>From</span>
        <strong>{{ fromDate }}</strong>
      </button>
      <button
        type="button"
        class="doc-chip"
        [class.doc-chip--active]="activeDatePicker === 'to'"
        (click)="openDateModal('to')"
      >
        <span>To</span>
        <strong>{{ toDate }}</strong>
      </button>
    </div>

    <div class="doctor-calendar">
      <header class="doctor-calendar__header">
        <span>October 2021</span>
        <div class="doctor-calendar__nav">
          <button type="button">‹</button>
          <button type="button">›</button>
        </div>
      </header>
      <div class="doctor-calendar__grid">
        <span *ngFor="let day of ['M','T','W','T','F','S','S']" class="doctor-calendar__cell doctor-calendar__cell--muted">{{ day }}</span>
        <button *ngFor="let date of [].constructor(31); let i = index" type="button"
          class="doctor-calendar__cell"
        >
          {{ i + 1 }}
        </button>
      </div>
    </div>
  </div>
</div>
