<div class="doctor-profile">
  <section class="doctor-profile__card">
    <h1 class="doctor-profile__title">Personal Information</h1>

    <form (ngSubmit)="saveProfile()" class="doctor-profile__form" novalidate>
      <label class="doctor-profile__label" for="name">Doctor Name</label>
      <input
        id="name"
        name="name"
        type="text"
        required
        [(ngModel)]="name"
        class="doctor-profile__input"
        placeholder="Enter your name"
      />

      <label class="doctor-profile__label" for="idNumber">ID Number</label>
      <input
        id="idNumber"
        name="idNumber"
        type="text"
        required
        [(ngModel)]="idNumber"
        class="doctor-profile__input"
        placeholder="Enter your ID"
      />

      <button type="submit" class="doctor-profile__button">
        Save
      </button>

      <p class="doctor-profile__success" *ngIf="showSuccess">Profile updated successfully.</p>
    </form>
  </section>
</div>
