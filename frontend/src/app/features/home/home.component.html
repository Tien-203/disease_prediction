<div class="home-container">
  <section class="hero">
    <div class="hero-content">
      <h1>Disease Prediction System</h1>
      <p class="subtitle">AI-powered disease prediction based on symptoms</p>
      <div class="hero-actions">
        <button mat-raised-button color="primary" routerLink="/auth/register" size="large">
          <mat-icon>person_add</mat-icon>
          Get Started
        </button>
        <button mat-button routerLink="/auth/login" size="large">
          <mat-icon>login</mat-icon>
          Login
        </button>
      </div>
    </div>
  </section>

  <section class="features">
    <h2>Features</h2>
    <div class="features-grid">
      @for (feature of features; track feature.title) {
        <mat-card class="feature-card">
          <mat-card-header>
            <mat-icon class="feature-icon">{{ feature.icon }}</mat-icon>
            <mat-card-title>{{ feature.title }}</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <p>{{ feature.description }}</p>
          </mat-card-content>
        </mat-card>
      }
    </div>
  </section>
</div>
