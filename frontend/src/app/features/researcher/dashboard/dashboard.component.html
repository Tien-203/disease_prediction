<div class="dashboard-container">
  <h1>Researcher Dashboard</h1>
  
  <div class="stats-grid">
    @for (stat of researchStats; track stat.label) {
      <mat-card class="stat-card">
        <mat-card-content>
          <div class="stat-content">
            <div class="stat-info">
              <div class="stat-label">{{ stat.label }}</div>
              <div class="stat-value">{{ stat.value }}</div>
            </div>
            <mat-icon [color]="stat.color" class="stat-icon">{{ stat.icon }}</mat-icon>
          </div>
        </mat-card-content>
      </mat-card>
    }
  </div>

  <mat-card class="actions-card">
    <mat-card-header>
      <mat-card-title>Research Tools</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="actions-grid">
        <button mat-raised-button color="primary" routerLink="/researcher/statistics">
          <mat-icon>bar_chart</mat-icon>
          Statistics
        </button>
        <button mat-raised-button color="accent" routerLink="/researcher/exploration">
          <mat-icon>explore</mat-icon>
          Data Exploration
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
