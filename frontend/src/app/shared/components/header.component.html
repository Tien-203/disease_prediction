<header class="app-header">
  <div class="header-container">
    <!-- Brand Logo -->
    <div class="header-brand">
      <a [routerLink]="homeRoute" class="header-logo">
        {{ appName }}
      </a>
    </div>

    <!-- Authenticated Navigation -->
    <ng-container *ngIf="isAuthenticated; else guestNav">
      <nav class="header-nav">
        <!-- Nav Links -->
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.path"
          routerLinkActive="nav-link-active"
          [routerLinkActiveOptions]="link.exact ? exactMatch : defaultMatch"
          class="nav-link"
        >
          {{ link.label }}
        </a>

        <!-- Logout Button -->
        <button
          type="button"
          class="btn-logout"
          (click)="logout()"
        >
          Log Out
        </button>
      </nav>
    </ng-container>

    <!-- Guest Navigation -->
    <ng-template #guestNav>
      <div class="header-guest">
        <a routerLink="/login" class="btn-login">
          Login
        </a>
      </div>
    </ng-template>
  </div>
</header>
