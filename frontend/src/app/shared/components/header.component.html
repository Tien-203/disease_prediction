<header class="app-header">
  <div class="app-header__inner">
    <div class="app-header__brand">
      <a [routerLink]="homeRoute" class="app-header__logo">
        {{ appName }}
      </a>
    </div>

    <ng-container *ngIf="isAuthenticated; else guestNav">
      <nav class="app-header__nav">
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.path"
          routerLinkActive="app-header__link--active"
          [routerLinkActiveOptions]="link.exact ? exactMatch : defaultMatch"
          class="app-header__link"
        >
          {{ link.label }}
        </a>

        <!-- Role Switcher Dropdown -->
        <div class="app-header__role-switcher">
          <button
            type="button"
            class="app-header__role-button"
            (click)="toggleRoleSwitcher()"
            aria-label="Switch role"
          >
            {{ currentRoleDisplay }}
            <span class="app-header__role-arrow" [class.app-header__role-arrow--open]="showRoleSwitcher">▼</span>
          </button>

          <div class="app-header__role-dropdown" *ngIf="showRoleSwitcher">
            <button
              *ngFor="let role of availableRoles"
              type="button"
              class="app-header__role-option"
              [class.app-header__role-option--active]="isRoleActive(role.value)"
              (click)="switchRole(role.value)"
            >
              <span class="app-header__role-icon">{{ role.icon }}</span>
              <span class="app-header__role-label">{{ role.label }}</span>
            </button>
          </div>
        </div>

        <button type="button" class="app-header__logout" (click)="logout()" aria-label="Logout">
          Log Out
        </button>
      </nav>
    </ng-container>

    <ng-template #guestNav>
      <div class="app-header__guest">
        <a routerLink="/login" class="app-header__link app-header__link--guest">
          Login
        </a>
      </div>
    </ng-template>
  </div>
</header>
